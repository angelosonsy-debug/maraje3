openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the shared Maraje3 student resource catalog
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Public academic resource catalog
  - name: catalog-admin
    description: Restricted catalog management
  - name: auth
    description: Contributor accounts and sessions (Google sign-in)
  - name: uploads
    description: Student file uploads awaiting admin review
  - name: reports
    description: Content and profile reports
  - name: engagement
    description: Downloads, thanks, contributor titles, and the per-faculty leaderboard
  - name: requests
    description: "\"مطلوب\" board — students ask for a file that doesn't exist yet"
  - name: growth
    description: "Stage 6 retention/growth: Telegram account linking. Exam reminders are client-only (no server endpoint); material share pages and the Telegram submissions/bulk-upload intake sit outside this JSON contract (binary/HTML routes) — see artifacts/api-server/src/routes/telegram.ts and routes/share.ts."
  - name: flashcards
    description: "Stage 7 light study mode — flashcard decks. Review progress itself is local-only (AsyncStorage), no server endpoint for it."
  - name: premium
    description: "Stage 7 one-time Premium purchase (react-native-iap) — server-side Google Play purchase verification."
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Get the published academic catalog
      deprecated: true
      description: Legacy full-catalog endpoint. Use /catalog/tree and /materials.
      responses:
        "200":
          description: Published catalog hierarchy and materials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
  /catalog/search:
    get:
      operationId: searchCatalog
      tags: [catalog]
      summary: Search published catalog materials
      deprecated: true
      description: Legacy in-memory search endpoint. Use the database-backed /materials endpoint.
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: universityId
          schema:
            type: integer
        - in: query
          name: facultyId
          schema:
            type: integer
        - in: query
          name: academicYearId
          schema:
            type: integer
        - in: query
          name: semesterId
          schema:
            type: integer
        - in: query
          name: subjectId
          schema:
            type: integer
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/MaterialCategory"
      responses:
        "200":
          description: Matching published materials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialSearchResponse"
  /catalog/tree:
    get:
      operationId: getCatalogTree
      tags: [catalog]
      summary: Get the academic hierarchy without material records
      responses:
        "200":
          description: Academic hierarchy, suitable for short-lived caching
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogTreeResponse"
        "304":
          description: The cached hierarchy has not changed
  /materials:
    get:
      operationId: getMaterials
      tags: [catalog]
      summary: Find published materials with database filters and pagination
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: universityId
          schema:
            type: integer
        - in: query
          name: facultyId
          schema:
            type: integer
        - in: query
          name: academicYearId
          schema:
            type: integer
        - in: query
          name: semesterId
          schema:
            type: integer
        - in: query
          name: subjectId
          schema:
            type: integer
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/MaterialCategory"
        - in: query
          name: examType
          schema:
            $ref: "#/components/schemas/ExamType"
        - in: query
          name: examYear
          schema:
            type: integer
        - in: query
          name: professorName
          schema:
            type: string
            maxLength: 120
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: A page of matching published materials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialsPageResponse"
        "400":
          description: Invalid filters or pagination parameters
  /materials/{id}:
    get:
      operationId: getMaterial
      tags: [catalog]
      summary: Get one published material
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published material record, with its public uploader attribution line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
        "404":
          description: The material does not exist or is not published
  /catalog/admin/access:
    get:
      operationId: getCatalogAdminAccess
      tags: [catalog-admin]
      summary: Verify administrator access
      security:
        - adminBearer: []
      responses:
        "200":
          description: Administrator token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessResponse"
        "401":
          description: Administrator token is missing or invalid
        "503":
          description: Administrator access is not configured on the server
  /catalog/admin/catalog:
    get:
      operationId: getCatalogAdminCatalog
      tags: [catalog-admin]
      summary: Get all catalog records, including drafts
      security:
        - adminBearer: []
      responses:
        "200":
          description: Complete catalog for administrators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "401":
          description: Administrator token is missing or invalid
        "503":
          description: Administrator access is not configured on the server
  /catalog/admin/manage:
    post:
      operationId: manageCatalogAdmin
      tags: [catalog-admin]
      summary: Create, update, or remove a catalog record
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminManageRequest"
      responses:
        "200":
          description: Catalog change applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminManageResponse"
        "400":
          description: Request is invalid or content authorization is missing
        "401":
          description: Administrator token is missing or invalid
        "404":
          description: Record does not exist
        "409":
          description: Record cannot be removed while it has child records
        "503":
          description: Administrator access is not configured on the server
  /auth/google:
    post:
      operationId: signInWithGoogle
      tags: [auth]
      summary: Sign in or register a contributor with a Google ID token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignInRequest"
      responses:
        "200":
          description: Session created and user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSignInResponse"
        "400":
          description: Request body is invalid
        "401":
          description: The Google ID token could not be verified
        "503":
          description: Google sign-in is not configured on the server
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in contributor's profile
      security:
        - userBearer: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Session token is missing, invalid, or expired
    patch:
      operationId: updateCurrentUser
      tags: [auth]
      summary: Update the signed-in contributor's profile
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentUserRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Request body is invalid
        "401":
          description: Session token is missing, invalid, or expired
    delete:
      operationId: deleteCurrentUser
      tags: [auth]
      summary: Delete the signed-in contributor's account
      description: Unlinks the contributor's identity from their account and materials. Approved materials remain published without attribution.
      security:
        - userBearer: []
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResult"
        "401":
          description: Session token is missing, invalid, or expired
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Exchange a still-valid session token for a new one with renewed expiry
      security:
        - userBearer: []
      responses:
        "200":
          description: Renewed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokenResponse"
        "401":
          description: Session token is missing, invalid, or expired
  /uploads/presign:
    post:
      operationId: presignUpload
      tags: [uploads]
      summary: Request a destination to upload a file to before submitting it
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPresignRequest"
      responses:
        "200":
          description: Upload destination (direct presigned URL, or server relay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPresignResponse"
        "400":
          description: File name, type, or size is not allowed
        "401":
          description: Session token is missing, invalid, or expired
        "403":
          description: This account's uploads are currently suspended
        "429":
          description: Daily upload limit reached
  /uploads:
    post:
      operationId: createMaterialUpload
      tags: [uploads]
      summary: Submit an uploaded file as a material pending review
      description: Server re-downloads the object to verify its real file type (magic bytes) and content hash before creating the material record.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaterialUploadRequest"
      responses:
        "200":
          description: Material created as pending, or an existing duplicate was found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialUploadResult"
        "400":
          description: Request is invalid, the file type could not be verified, or the subject does not exist
        "401":
          description: Session token is missing, invalid, or expired
        "403":
          description: This account's uploads are currently suspended
        "404":
          description: The uploaded object was not found (upload may not have completed)
  /uploads/mine:
    get:
      operationId: getMyUploads
      tags: [uploads]
      summary: List the signed-in contributor's own materials, including pending and rejected ones
      security:
        - userBearer: []
      responses:
        "200":
          description: The contributor's materials in any publication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyUploadsResponse"
        "401":
          description: Session token is missing, invalid, or expired
  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Report a material, a contributor profile, or a request
      description: Works without signing in; an anonymous device id is used instead to apply the rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "200":
          description: Report recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSubmissionResult"
        "400":
          description: Request is invalid
        "429":
          description: Too many reports from this device recently
  /catalog/admin/reports:
    get:
      operationId: getAdminReports
      tags: [reports, catalog-admin]
      summary: List reports for administrator review
      security:
        - adminBearer: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ReportStatus"
      responses:
        "200":
          description: Matching reports, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportsResponse"
        "401":
          description: Administrator token is missing or invalid
        "503":
          description: Administrator access is not configured on the server
  /catalog/admin/reports/{id}/resolve:
    post:
      operationId: resolveAdminReport
      tags: [reports, catalog-admin]
      summary: Act on a report (unpublish the target, dismiss, or suspend the uploader)
      security:
        - adminBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReportActionRequest"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportActionResponse"
        "400":
          description: Request is invalid
        "401":
          description: Administrator token is missing or invalid
        "404":
          description: Report does not exist
  /materials/{id}/download:
    post:
      operationId: recordMaterialDownload
      tags: [engagement]
      summary: Count a download of a published material
      description: Deduplicated once per device per file per calendar day (UTC). Signing in is optional (an Authorization bearer header is honored if present) — the X-Device-Id header is what dedup and the "self-download doesn't count" rule key off. A contributor downloading their own material is accepted but never counted.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Updated (or unchanged, if already counted today) download count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordDownloadResponse"
        "400":
          description: X-Device-Id header is missing
        "404":
          description: The material does not exist or is not published
  /materials/{id}/thanks:
    post:
      operationId: recordMaterialThanks
      tags: [engagement]
      summary: Send a one-time "شكراً" to a published material's contributor
      description: One per device per file, forever (not per day, unlike downloads). A contributor thanking their own material is accepted but never counted.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Updated (or unchanged, if this device already thanked it) thanks count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordThanksResponse"
        "400":
          description: X-Device-Id header is missing
        "404":
          description: The material does not exist or is not published
  /contributors/{id}:
    get:
      operationId: getContributorProfile
      tags: [engagement]
      summary: Public contributor profile (name, faculty, title, stats, published materials)
      description: Respects hideIdentity — returns 404 for a contributor who has chosen to hide their identity, the same as if the account did not exist.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public contributor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributorProfileResponse"
        "404":
          description: Contributor does not exist or has hidden their identity
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [engagement]
      summary: Top 10 contributors in one faculty, by published-material downloads
      description: "Note: there is no explicit start/end date on a semester in this catalog, so the 'semester' scope approximates \"current semester\" as a rolling trailing window (LEADERBOARD_WINDOW_DAYS, default 120 days) of download activity rather than a true semester boundary."
      parameters:
        - in: query
          name: facultyId
          required: true
          schema:
            type: integer
        - in: query
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/LeaderboardScope"
      responses:
        "200":
          description: Top contributors in this faculty for the requested scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
        "400":
          description: facultyId or scope is invalid
        "404":
          description: The faculty does not exist
  /requests:
    get:
      operationId: getRequests
      tags: [requests]
      summary: List "مطلوب" board requests for one faculty, sorted by "أنا كمان" count then newest
      parameters:
        - in: query
          name: facultyId
          required: true
          schema:
            type: integer
        - in: query
          name: subjectId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/RequestStatus"
      responses:
        "200":
          description: Matching requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestsListResponse"
        "400":
          description: facultyId is invalid
    post:
      operationId: createRequest
      tags: [requests]
      summary: Ask for a file that doesn't exist yet
      description: Requires signing in (to curb spam) and is capped at 3 requests/day/account.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestRequest"
      responses:
        "200":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCreationResult"
        "400":
          description: Request body is invalid, or the faculty/subject does not exist
        "401":
          description: Session token is missing, invalid, or expired
        "429":
          description: Daily request limit reached
  /requests/{id}/me-too:
    post:
      operationId: recordRequestMeToo
      tags: [requests]
      summary: Add a one-time "أنا كمان" to a request
      description: Works without signing in — one per device per request, forever, deduplicated via X-Device-Id.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Updated (or unchanged, if this device already added "أنا كمان") count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestMeTooResponse"
        "400":
          description: X-Device-Id header is missing
        "404":
          description: The request does not exist
  /catalog/admin/requests/{id}/manage:
    post:
      operationId: manageAdminRequest
      tags: [requests, catalog-admin]
      summary: Close or delete a "مطلوب" board request
      security:
        - adminBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRequestActionRequest"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRequestActionResponse"
        "400":
          description: Request body is invalid
        "401":
          description: Administrator token is missing or invalid
        "404":
          description: The request does not exist
  /telegram/link-code:
    post:
      operationId: createTelegramLinkCode
      tags: [growth]
      summary: Generate a short-lived code to link this account to the Telegram bot
      description: The student sends "/ربط <code>" to the bot within the expiry window to complete the link.
      security:
        - userBearer: []
      responses:
        "200":
          description: A fresh one-time code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLinkCodeResponse"
        "401":
          description: Session token is missing or invalid
  /internal/telegram/link:
    post:
      operationId: consumeTelegramLinkCode
      tags: [growth]
      summary: Internal — the Telegram bot redeems a link code to attach a Telegram identity to an account
      description: Called only by artifacts/telegram-bot, authenticated with the shared BOT_API_SECRET (never exposed to the app or the browser).
      parameters:
        - in: header
          name: X-Bot-Secret
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumeTelegramLinkCodeRequest"
      responses:
        "200":
          description: Account linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLinkResult"
        "400":
          description: Code is invalid, already used, or expired
        "401":
          description: X-Bot-Secret is missing or incorrect
  /flashcards/decks:
    get:
      operationId: getFlashcardDecks
      tags: [flashcards]
      summary: List published flashcard decks for a subject
      parameters:
        - in: query
          name: subjectId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published decks for the subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeckList"
        "400":
          description: subjectId is missing or invalid
    post:
      operationId: suggestFlashcardDeck
      tags: [flashcards]
      summary: A signed-in contributor suggests a new deck (goes to pending review)
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestFlashcardDeckRequest"
      responses:
        "200":
          description: Deck created as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeckCreateResult"
        "400":
          description: Request body is invalid
        "401":
          description: Session token is missing or invalid
  /flashcards/decks/{id}:
    get:
      operationId: getFlashcardDeck
      tags: [flashcards]
      summary: Get a published deck with all of its cards
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The deck and its cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeckDetail"
        "404":
          description: The deck does not exist or is not published
  /catalog/admin/flashcards:
    get:
      operationId: getAdminFlashcardDecks
      tags: [flashcards, catalog-admin]
      summary: List all flashcard decks (any status) for the admin review queue
      security:
        - adminBearer: []
      responses:
        "200":
          description: All decks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlashcardDeckList"
        "401":
          description: Administrator token is missing or invalid
    post:
      operationId: createAdminFlashcardDeck
      tags: [flashcards, catalog-admin]
      summary: Admin creates a deck directly (e.g. bulk-pasted "question | answer" lines) — published immediately
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestFlashcardDeckRequest"
      responses:
        "200":
          description: Deck created as published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeckCreateResult"
        "400":
          description: Request body is invalid
        "401":
          description: Administrator token is missing or invalid
  /catalog/admin/flashcards/{id}:
    get:
      operationId: getAdminFlashcardDeck
      tags: [flashcards, catalog-admin]
      summary: Get any deck (including pending/rejected) with its cards, for review
      security:
        - adminBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The deck and its cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeckDetail"
        "401":
          description: Administrator token is missing or invalid
        "404":
          description: The deck does not exist
  /catalog/admin/flashcards/{id}/manage:
    post:
      operationId: manageAdminFlashcardDeck
      tags: [flashcards, catalog-admin]
      summary: Publish, reject, or delete a flashcard deck
      security:
        - adminBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardDeckManageAction"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeckManageResult"
        "400":
          description: Request body is invalid
        "401":
          description: Administrator token is missing or invalid
        "404":
          description: The deck does not exist
  /premium/verify-purchase:
    post:
      operationId: verifyPremiumPurchase
      tags: [premium]
      summary: Verify a Google Play one-time purchase and grant Premium to the signed-in account
      description: Calls the Google Play Developer API server-side; requires GOOGLE_PLAY_SERVICE_ACCOUNT_JSON to be configured.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPremiumPurchaseRequest"
      responses:
        "200":
          description: Purchase verified and Premium granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumPurchaseResult"
        "400":
          description: Request body is invalid, or the purchase could not be verified as valid/paid for this product
        "401":
          description: Session token is missing or invalid
        "503":
          description: Purchase verification is not configured on the server
