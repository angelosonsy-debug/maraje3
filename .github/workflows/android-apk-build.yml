name: Android APK Build (مراجعي / Maraje3)

# Builds a plain, installable Android .apk directly in this workflow — no
# Expo/EAS account, no EXPO_TOKEN, no external service. It generates the
# native android/ project with `expo prebuild` and builds it with Gradle,
# the same way any plain React Native app builds in CI.
#
# Trade-off, on purpose: the APK is signed with the Android debug keystore
# (auto-generated by Gradle, not a secret), not a release key. That means
# it installs and runs on any Android device exactly like a release build,
# but it is NOT the artifact you'd upload to Google Play — Play requires an
# upload key you control (see docs/play-checklist.md, item 7). For a real
# Play Store submission, a release-signed .aab still needs either a
# keystore secret added here or `eas build`. For sideloading/testing an
# APK on a phone right now, debug signing is exactly what's needed and
# needs zero setup.

on:
  push:
    branches: [main]
    paths:
      - "artifacts/maraje3/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk-build.yml"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Override the action's own default ("tools platform-tools") —
          # the legacy "tools" package no longer exists in Google's SDK
          # repository and makes sdkmanager fail with "Failed to find
          # package 'tools'" (exit code 1), which killed the first run of
          # this workflow. platform-tools (adb) is the only package this
          # build actually needs installed up front; the Android Gradle
          # Plugin downloads the specific platform/build-tools versions it
          # needs on its own during the Gradle build below, using the
          # already-accepted licenses.
          packages: platform-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the app
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/maraje3 run typecheck

      - name: Generate native Android project (expo prebuild)
        working-directory: artifacts/maraje3
        # --no-install: dependencies are already resolved by the pnpm
        # install above (workspace packages prebuild can't re-resolve with
        # npm/yarn anyway); --clean: start from a fresh android/ dir on
        # every run so stale generated files never linger between builds.
        run: npx expo prebuild --platform android --no-install --clean
        env:
          # app.config.js reads these at prebuild time; unset falls back to
          # Google's own published AdMob test app ids, which is fine for a
          # build that isn't going to Play. Set real secrets here instead
          # once you have an AdMob account (see docs/play-checklist.md).
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}

      - name: Build debug APK
        working-directory: artifacts/maraje3/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate the built APK
        id: apk
        working-directory: artifacts/maraje3/android
        run: |
          path=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$path" ]; then
            echo "No APK found under app/build/outputs/apk/debug" >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: maraje3-debug-apk
          # Download it from this workflow run's "Artifacts" section on
          # GitHub (Actions tab → this run) — no expo.dev account needed.
          path: artifacts/maraje3/android/${{ steps.apk.outputs.path }}
          retention-days: 30
